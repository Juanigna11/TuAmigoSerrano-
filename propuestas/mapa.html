<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propuestas de mapa · Tu Amigo Serrano</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Nunito+Sans:wght@400;700&display=swap">
<style>
body{margin:0;padding:20px;background:#F4F6F7;font-family:"Nunito Sans",sans-serif;color:#142A40}
h1{font-family:"Bricolage Grotesque";font-size:28px;margin:0 0 16px}
.grilla{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.op h2{font-family:"Bricolage Grotesque";font-size:20px;margin:0 0 8px}
.mapa{height:760px;border-radius:16px;border:2px solid #142A40;overflow:hidden}
.pin{width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px #142A40}
.etq{font-family:"Bricolage Grotesque";font-weight:800;font-size:14px;color:#142A40;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.poi{display:flex;align-items:center;gap:4px;font:700 11px "Nunito Sans";color:#24543F;white-space:nowrap;text-shadow:0 0 3px #fff,0 0 3px #fff}
.poi i{width:18px;height:18px;border-radius:5px;background:#F2B33D;border:1.5px solid #142A40;display:grid;place-items:center;font-style:normal;font-size:11px}
.leaflet-div-icon{background:none;border:0}
</style>
</head>
<body>
<h1>Propuestas de mapa (borrador, no enlazado desde la landing)</h1>
<div class="grilla">
  <div class="op"><h2>A · Relieve y curvas de nivel</h2><div class="mapa" id="a"></div></div>
  <div class="op"><h2>B · Mapa claro de calles</h2><div class="mapa" id="b"></div></div>
  <div class="op"><h2>C · Mapa gris minimalista</h2><div class="mapa" id="c"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const COL={Sur:"#3E6E96",Centro:"#24543F",Norte:"#8DBA6E"};
const PUEBLOS=[["La Calera","Sur",-31.343,-64.336],["Saldán","Sur",-31.303,-64.315],["Villa Allende","Sur",-31.295,-64.295],["Mendiolaza","Sur",-31.265,-64.302],
["Unquillo","Centro",-31.230,-64.316],["Río Ceballos","Centro",-31.165,-64.322],["Salsipuedes","Norte",-31.137,-64.296],["El Manzano","Norte",-31.083,-64.299],
["Agua de Oro","Norte",-31.065,-64.300],["La Granja","Norte",-31.008,-64.263],["Ascochinga","Norte",-30.958,-64.275]];
// Lugares de referencia (ubicación aproximada, a verificar antes de publicar)
const LUGARES=[["Dique La Quebrada","≈",-31.152,-64.350],["Dique Mal Paso","≈",-31.347,-64.37],["Capilla Buffo","✝",-31.205,-64.335],
["Cristo del Ñu Porá","✝",-31.18,-64.345],["Camino del Cuadrado","↗",-31.13,-64.37],["Estancia Santa Catalina","✝",-30.876,-64.235]];
const CAPAS={
 a:["https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",'© OpenStreetMap, SRTM · estilo OpenTopoMap (CC-BY-SA)'],
 b:["https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",'© OpenStreetMap © CARTO'],
 c:["https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",'© OpenStreetMap © CARTO']};
for(const id of ["a","b","c"]){
  const m=L.map(id,{zoomControl:true,scrollWheelZoom:false,attributionControl:true});
  L.tileLayer(CAPAS[id][0],{attribution:CAPAS[id][1],maxZoom:17,subdomains:"abc"}).addTo(m);
  const pts=[];
  PUEBLOS.forEach(([n,t,la,lo],i)=>{pts.push([la,lo]);
    L.marker([la,lo],{icon:L.divIcon({className:"",html:`<div class="pin" style="background:${COL[t]}"></div>`,iconSize:[16,16],iconAnchor:[8,8]})}).addTo(m);
    const izq=(n==="Saldán"||n==="Agua de Oro");
    L.marker([la,lo],{icon:L.divIcon({className:"",html:`<div class="etq">${n}</div>`,iconSize:[0,0],iconAnchor:izq?[ (n.length*8)+12,9]:[-12,9]})}).addTo(m);});
  LUGARES.forEach(([n,ic,la,lo])=>{L.marker([la,lo],{icon:L.divIcon({className:"",html:`<div class="poi"><i>${ic}</i>${n}</div>`,iconSize:[0,0],iconAnchor:[9,9]})}).addTo(m);});
  m.fitBounds(pts,{padding:[30,30]});
}
</script>
</body>
</html>
