<!DOCTYPE html>
<!--
  Fuente de la imagen para compartir (img/og.png, 1200 × 630).
  No es parte de la web: sirve para volver a generar la imagen
  si cambia el diseño. Cómo regenerarla: ver README.md.
-->
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Nunito+Sans:wght@600&display=block">
  <style>
    html, body { margin: 0; }
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      position: relative;
      background: #1F3B57;
      display: flex;
      align-items: center;
      gap: 64px;
      padding: 0 96px 70px;
      box-sizing: border-box;
      font-family: "Nunito Sans", sans-serif;
    }
    .sello {
      flex-shrink: 0;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: #142A40;
      display: grid;
      place-items: center;
    }
    .sello img { width: 165px; transform: translate(-3%, 2%); }
    h1 {
      margin: 0;
      color: #fff;
      font-family: "Bricolage Grotesque", sans-serif;
      font-weight: 800;
      font-size: 84px;
      line-height: 0.98;
      letter-spacing: -0.03em;
    }
    p {
      margin: 22px 0 0;
      color: #CFE0EC;
      font-size: 32px;
      line-height: 1.3;
    }
    svg.sierras { position: absolute; left: 0; bottom: 0; width: 100%; height: 110px; }
  </style>
</head>
<body>
  <div class="sello"><img src="../img/logo.svg" alt=""></div>
  <div>
    <h1>Tu Amigo<br>Serrano</h1>
    <p>Trabajadores recomendados<br>por vecinos de Sierras Chicas</p>
  </div>
  <svg class="sierras" viewBox="0 0 1440 120" preserveAspectRatio="none">
    <path fill="#142A40" d="M0 120 L0 70 C120 40 220 30 340 52 C430 68 520 20 640 18 C760 16 840 58 960 50 C1080 42 1160 8 1290 22 C1360 30 1410 48 1440 44 L1440 120 Z"/>
    <path fill="#8DBA6E" d="M0 120 L0 96 C160 80 300 74 460 88 C600 100 700 70 860 72 C1020 74 1120 98 1260 92 C1340 88 1400 82 1440 84 L1440 120 Z"/>
  </svg>
</body>
</html>
